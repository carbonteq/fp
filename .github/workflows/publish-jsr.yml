name: Publish (JSR)

on:
  # Dispatch with: gh workflow run publish-jsr.yml --ref v0.11.1
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify release tag and versions
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e '
            const { readFileSync } = require("node:fs");
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const deno = JSON.parse(readFileSync("deno.jsonc", "utf8"));
            const { RELEASE_REF, RELEASE_TAG } = process.env;
            if (!RELEASE_REF.startsWith("refs/tags/") || RELEASE_REF !== "refs/tags/" + RELEASE_TAG ||
                RELEASE_TAG !== "v" + pkg.version || pkg.version !== deno.version) {
              throw new Error(`Release ref ${RELEASE_REF} must match npm ${pkg.version} and Deno ${deno.version}`);
            }
          '
      - name: Publish
        run: bunx jsr publish --allow-slow-types
