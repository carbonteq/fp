name: Publish (NPM)

on:
  # Dispatch with: gh workflow run publish-npm.yml --ref v0.11.1
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22 for NPM publishing
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release tag and versions
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const deno = JSON.parse(readFileSync("deno.jsonc", "utf8"));
            const { RELEASE_REF, RELEASE_TAG } = process.env;
            if (!RELEASE_REF.startsWith("refs/tags/") || RELEASE_REF !== "refs/tags/" + RELEASE_TAG ||
                RELEASE_TAG !== "v" + pkg.version || pkg.version !== deno.version) {
              throw new Error(`Release ref ${RELEASE_REF} must match npm ${pkg.version} and Deno ${deno.version}`);
            }
          '

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: log npm version
        run: npm --version

      - name: Update npm for publishing
        run: npm install -g npm@11

      - name: log updated npm version
        run: npm --version

      # https://gist.github.com/jaywcjlove/a178278521a6f72c74525d3f1d9c4bf9
      - name: Publish
        run: NODE_AUTH_TOKEN="" npm publish --provenance --access public
