name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install Dependencies
        run: bun install

      - name: Create Release PR or GitHub Release
        uses: changesets/action@v2.1.2
        with:
          pr-title: "🦋 Changeset release"
          commit-message: "chore(changeset): release"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run ver
          publish-script: bun run release
          create-github-releases: true
