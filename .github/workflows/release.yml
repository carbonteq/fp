name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true # required for later commit
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 22 for NPM publishing
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Create Release PR or Publish Packages
        uses: changesets/action@v2.1.2
        id: changesets
        with:
          pr-title: "🦋 Changeset release"
          commit-message: "chore(changeset): release"
          publish-script: bun run release
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""

      - name: Update version for deno/jsr
        if: steps.changesets.outputs.published == 'true'
        run: node sync_versions.mjs
      - name: Format deno.jsonc
        if: steps.changesets.outputs.published == 'true'
        run: bunx --no-install oxfmt deno.jsonc
      - name: Commit updated deno.jsonc
        if: steps.changesets.outputs.published == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update version deno.jsonc
          commit_options: "--no-verify --signoff"
          file_pattern: deno.jsonc
